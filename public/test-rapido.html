<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Rápido - Móvil</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #667eea;
            text-align: center;
        }

        .info {
            background: #e3f2fd;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            word-break: break-all;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 5px;
            width: 100%;
            font-size: 16px;
            cursor: pointer;
            margin: 5px 0;
        }

        button:hover {
            background: #5568d3;
        }

        .label {
            font-weight: bold;
            color: #666;
        }
    </style>
</head>

<body>
    <h1>🔧 Test Rápido Móvil</h1>

    <div class="card">
        <h3>Información de Conexión</h3>
        <div class="info">
            <div class="label">URL Actual:</div>
            <div id="currentUrl"></div>
        </div>
        <div class="info">
            <div class="label">Protocolo:</div>
            <div id="protocol"></div>
        </div>
        <div class="info">
            <div class="label">Host:</div>
            <div id="host"></div>
        </div>
        <div class="info">
            <div class="label">Base URL Calculada:</div>
            <div id="baseUrl"></div>
        </div>
    </div>

    <div class="card">
        <h3>Pruebas Rápidas</h3>
        <button onclick="testLogin()">1. Ir a Login</button>
        <button onclick="testDashboard()">2. Ir a Dashboard</button>
        <button onclick="testClientes()">3. Ir a Clientes</button>
        <button onclick="testCobranza()">4. Ir a Cobranza</button>
        <button onclick="testDesembolsos()">5. Ir a Desembolsos</button>
    </div>

    <div class="card">
        <h3>✅ Verificación</h3>
        <div id="result"></div>
    </div>

    <script>
        // Función para construir base URL
        function getBaseUrl() {
            const protocol = window.location.protocol;
            const host = window.location.host;
            const pathname = window.location.pathname;

            let basePath = pathname.substring(0, pathname.indexOf('/public'));
            if (!basePath) {
                const projectIndex = pathname.indexOf('sistema-financiera');
                if (projectIndex !== -1) {
                    basePath = pathname.substring(0, projectIndex + 'sistema-financiera'.length);
                }
            }

            return protocol + '//' + host + basePath;
        }

        // Mostrar información
        const baseUrl = getBaseUrl();
        document.getElementById('currentUrl').textContent = window.location.href;
        document.getElementById('protocol').textContent = window.location.protocol;
        document.getElementById('host').textContent = window.location.host;
        document.getElementById('baseUrl').textContent = baseUrl;

        // Verificar si es móvil
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const isLocalhost = window.location.host.includes('localhost');

        let resultHtml = '<div class="success">';
        if (isMobile) {
            resultHtml += '📱 Dispositivo móvil detectado<br>';
        } else {
            resultHtml += '💻 Dispositivo de escritorio detectado<br>';
        }

        if (isLocalhost) {
            resultHtml += '⚠️ Accediendo vía localhost (solo funciona en PC)<br>';
        } else {
            resultHtml += '✅ Accediendo vía IP de red (funciona en móvil)<br>';
        }

        resultHtml += '<br><strong>Base URL:</strong> ' + baseUrl;
        resultHtml += '</div>';

        document.getElementById('result').innerHTML = resultHtml;

        // Funciones de navegación
        function testLogin() {
            window.location.href = baseUrl + '/public/login.php';
        }

        function testDashboard() {
            window.location.href = baseUrl + '/public/admin/dashboard.php';
        }

        function testClientes() {
            window.location.href = baseUrl + '/public/admin/clientes.php';
        }

        function testCobranza() {
            window.location.href = baseUrl + '/public/admin/cobranza.php';
        }

        function testDesembolsos() {
            window.location.href = baseUrl + '/public/admin/desembolsos.php';
        }
    </script>
</body>

</html>
